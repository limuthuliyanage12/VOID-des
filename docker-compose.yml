# Local sandbox: MongoDB as a single-node replica set (transactions need one) and Redis for BullMQ.
#   docker compose up -d
#   MONGODB_URI=mongodb://localhost:27017/void?replicaSet=rs0&directConnection=true
#   REDIS_URL=redis://localhost:6379
services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      # Starts the replica set on first boot, then reports healthy once it has a primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
volumes:
  mongo-data:
  redis-data:
